name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $src = (Get-ChildItem -Filter *.pyw | Select-Object -First 1).FullName
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "VideoCoverGenerator" `
            --icon "$env:GITHUB_WORKSPACE\app.ico" `
            --collect-all tkinterdnd2 `
            --distpath dist --workpath build --specpath build `
            "$src"

      - name: Bundle font and README
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\bundle\fonts | Out-Null
          Move-Item dist\VideoCoverGenerator.exe dist\bundle\
          Copy-Item fonts\NotoSansSC-Regular.otf, fonts\OFL.txt dist\bundle\fonts\
          Copy-Item README.md dist\bundle\

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCoverGenerator-windows
          path: dist/bundle/
          retention-days: 30
